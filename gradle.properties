# ============================================================
# Настройки Gradle
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# ============================================================
# Parchment-маппинги
# https://parchmentmc.org/docs/getting-started
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Minecraft / NeoForge
# https://projects.neoforged.net/neoforged/neoforge
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[1,)

# ============================================================
# Kotlin for Forge — https://modrinth.com/mod/kotlin-for-forge
# Обязательно артефакт kotlinforforge-neoforge.
# ============================================================
kotlin_version=2.1.20
kff_version=5.8.0
kff_version_range=[5.8,)

# ============================================================
# Обязательные игровые зависимости (также кладутся в GitHub Release)
# ============================================================
ribbits_version=4.1.6
ribbits_version_range=[4.1,)
geckolib_version=4.7.6
yungsapi_version=1.21.1-NeoForge-5.1.5
# Игровая сборка Patchouli на Modrinth (NeoForge 1.21.1), кладётся в GitHub Release.
patchouli_version=1.21.1-93-neoforge

# ============================================================
# Метаданные мода
# ============================================================
mod_id=reallyusefulribbits
mod_name=Really Useful Ribbits
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.reallyusefulribbits.mod
mod_authors=Really Useful Ribbits contributors
mod_description=[Really Useful Ribbits](https://github.com/Nergan/really-useful-ribbits-mod): ribbits that fish, farm, trade, and cause trouble.
