modLoader = "javafml"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "https://github.com/Nergan/really-useful-ribbits-mod/issues"

[[mixins]]
config = "reallyusefulribbits.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Nergan/really-useful-ribbits-mod"
authors = "${mod_authors}"
description = '''
${mod_description}

Carry a ribbit on your head. Fishers, farmers, merchants, sorcerers and nitwits get real jobs.
Посадите риббита на голову. Рыбаки, фермеры, торговцы, чародеи и nitwit начинают работать.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "${kff_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ribbits"
type = "required"
versionRange = "${ribbits_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.7,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "yungsapi"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "farmersdelight"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "wanderingribbit"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

# Необязательная зависимость: если Patchouli есть в сборке, появляется
# гайд-книга. Если мода нет — аддон запускается как обычно.
[[dependencies.${mod_id}]]
modId = "patchouli"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
